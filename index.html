<!doctype html>

<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF9EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15130B" media="(prefers-color-scheme: dark)">
  <title>Cheese</title>
  <meta name="description" content="Durchsuchbare Käseliste mit Filtern nach Milchtyp, Milchart und essbarer Rinde.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧀</text></svg>">
  <script>
    // Apply saved theme before first paint (avoids a flash of the wrong theme)
    try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1>🧀 Cheese</h1>
      <span id="count" class="count" aria-live="polite"></span>
      <button id="theme" class="theme-toggle" type="button"></button>
    </div>
    <div class="search-row">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Käse suchen …" autocomplete="off" aria-label="Suche">
        <button id="clear" class="clear" type="button" aria-label="Suche leeren" hidden>×</button>
      </div>
      <button id="open-filters" class="filter-btn" type="button" aria-haspopup="dialog" aria-controls="filters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3zm3 6h12v2H6zm4 6h4v2h-4z"/></svg>
        <span>Filter</span>
        <span id="filter-badge" class="badge" hidden></span>
      </button>
    </div>
  </header>

  <nav id="az" class="az" aria-label="Alphabet"></nav>

  <main id="list" class="list"></main>
  <p id="empty" class="empty" hidden>Kein Käse gefunden.</p>

  <footer class="footer">
    <a href="https://github.com/johnjohndoe/cheese" rel="noopener">Quellcode auf GitHub</a>
    · <a href="https://github.com/johnjohndoe/cheese/blob/main/LICENSE" rel="noopener">AGPL-3.0</a>
  </footer>

  <dialog id="filters" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-grab">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2 id="sheet-title" tabindex="-1" autofocus>Filter</h2>
          <button id="reset" class="text-btn" type="button">Zurücksetzen</button>
        </div>
      </div>
      <div class="sheet-body">
        <div class="group" data-key="animal">
          <span class="label">Milchtyp</span>
          <div class="chips"></div>
        </div>
        <div class="group" data-key="milk">
          <span class="label">Milchart</span>
          <div class="chips"></div>
        </div>
        <div class="group" data-key="rind">
          <span class="label">Rinde essbar</span>
          <div class="chips"></div>
        </div>
      </div>
      <div class="sheet-foot">
        <button id="apply" class="filled-btn" type="button"></button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
